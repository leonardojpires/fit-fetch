version: "5.5.1"
services:
  fitfetch-backend: 
    build: ./backend
    container_name: fitfetch_c
    env_file: ".env"
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
  fitfetch-frontend:
    build: .
    container_name: fitfetch-f_c
    env_file: ".env"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    stdin_open: true
    tty: true